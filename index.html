<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>家庭行事曆與生活相簿</title>
  <link rel="icon" type="image/png" sizes="512x512" href="./icon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="./icon.png" />
  <meta name="apple-mobile-web-app-title" content="行事曆與相簿" />
  <meta name="theme-color" content="#daecf8" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="./style.css" />
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
  <!-- 頂部非阻塞 Toast 容器 -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!-- 初始載入畫面 -->
  <div id="screen-loading" class="fullscreen-state">
    <div class="spinner"></div>
    <p id="loading-text">正在連線 LINE 驗證身分...</p>
  </div>

  <!-- 待審核畫面 -->
  <div id="screen-pending" class="fullscreen-state hidden">
    <div class="state-card">
      <div class="state-icon pending"><i class="fa-solid fa-user-clock"></i></div>
      <h2>帳號等待核准中</h2>
      <p id="pending-desc">你的 LINE 帳號已自動登記，請通知管理員至 Google 試算表將你的 Role 欄位改為 <strong>active</strong>。</p>
      <div class="pending-user-box">
        <img id="pending-avatar" class="avatar-sm hidden" alt="頭像" />
        <span id="pending-name"></span>
      </div>
      <button id="btn-retry-auth" class="btn btn-primary" type="button">
        <i class="fa-solid fa-rotate-right"></i> 重新檢查權限
      </button>
    </div>
  </div>

  <!-- 錯誤與重新登入畫面 -->
  <div id="screen-error" class="fullscreen-state hidden">
    <div class="state-card">
      <div class="state-icon error"><i class="fa-solid fa-triangle-exclamation"></i></div>
      <h2>無法載入系統</h2>
      <p id="error-desc">連線發生異常，請稍後再試。</p>
      <div class="error-actions">
        <button id="btn-relogin-app" class="btn btn-primary" type="button">
          <i class="fa-brands fa-line"></i> 重新登入 LINE
        </button>
        <button id="btn-reload-app" class="btn btn-outline" type="button">
          <i class="fa-solid fa-rotate-right"></i> 重新整理
        </button>
      </div>
    </div>
  </div>

  <!-- 主應用程式介面 -->
  <div id="app-shell" class="app-shell hidden">
    <!-- 頂部列 -->
    <header class="app-header">
      <div class="header-title">
        <i id="header-icon" class="fa-regular fa-calendar-days"></i>
        <h1 id="header-text">家庭行事曆</h1>
      </div>
      <button id="btn-profile" class="profile-chip" type="button" title="修改顯示暱稱">
        <img id="my-avatar" class="avatar-xs hidden" alt="頭像" />
        <i id="my-avatar-fallback" class="fa-solid fa-circle-user"></i>
        <span id="my-name">成員</span>
        <i class="fa-solid fa-pen fa-2xs muted"></i>
      </button>
    </header>

    <!-- 分頁 1：行事曆 -->
    <main id="view-calendar" class="view-pane">
      <section class="calendar-card">
        <div class="cal-toolbar">
          <div class="cal-nav">
            <button id="btn-prev-month" class="icon-btn" type="button" aria-label="上個月">
              <i class="fa-solid fa-chevron-left"></i>
            </button>
            <h2 id="cal-month-label">2026 年 11 月</h2>
            <button id="btn-next-month" class="icon-btn" type="button" aria-label="下個月">
              <i class="fa-solid fa-chevron-right"></i>
            </button>
          </div>
          <div class="cal-toolbar-right">
            <div class="view-toggle" role="group" aria-label="切換行事曆視圖">
              <button id="btn-view-month" class="view-toggle-btn active" type="button">
                <i class="fa-solid fa-table-cells"></i> 月曆
              </button>
              <button id="btn-view-timeline" class="view-toggle-btn" type="button">
                <i class="fa-solid fa-bars-staggered"></i> 時間軸
              </button>
            </div>
            <button id="btn-today" class="btn btn-outline btn-sm" type="button">今天</button>
          </div>
        </div>

        <!-- 依標籤快速篩選列 -->
        <div id="cal-tag-filter" class="cal-tag-filter" aria-label="依標籤篩選行程"></div>

        <!-- 月曆格子視圖 -->
        <div id="cal-month-view">
          <div class="cal-weekdays">
            <span class="sun">日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span class="sat">六</span>
          </div>
          <div id="cal-grid" class="cal-grid"></div>
        </div>

        <!-- 時間軸視圖 -->
        <div id="cal-timeline-view" class="timeline-view hidden">
          <div id="cal-timeline-list" class="timeline-list"></div>
        </div>
      </section>

      <!-- 選中日期的行程與當日相簿縮圖（月曆視圖專用） -->
      <section class="day-panel">
        <div class="day-panel-header">
          <div>
            <h3 id="selected-date-label">2026-11-22</h3>
            <span id="selected-date-sub" class="sub-text"></span>
          </div>
          <button id="btn-add-event-inline" class="btn btn-outline btn-sm" type="button">
            <i class="fa-solid fa-plus"></i> 新增行程
          </button>
        </div>

        <div id="day-events-list" class="event-list"></div>

        <!-- 當日生活相簿輕量關聯縮圖條 -->
        <div id="day-photos-section" class="day-photos-box hidden">
          <div class="day-photos-header">
            <span><i class="fa-solid fa-camera"></i> 當日生活相簿</span>
            <button id="btn-view-day-album" class="link-btn" type="button">
              在相簿查看 <i class="fa-solid fa-arrow-right"></i>
            </button>
          </div>
          <div id="day-thumbs-strip" class="thumb-strip"></div>
        </div>
      </section>

      <!-- 右下角浮動按鈕群組（今日定位鈕僅於時間軸視圖顯示） -->
      <div class="fab-group">
        <button id="fab-scroll-today" class="fab fab-secondary hidden" type="button" title="跳至今日位置" aria-label="跳至今日位置">
          <i class="fa-solid fa-calendar-day"></i>
          <span>今日</span>
        </button>
        <button id="fab-add-event" class="fab" type="button" title="新增行程" aria-label="新增行程">
          <i class="fa-solid fa-plus"></i>
        </button>
      </div>
    </main>

    <!-- 分頁 2：生活相簿 -->
    <main id="view-album" class="view-pane hidden">
      <div class="album-tip-banner">
        <i class="fa-brands fa-line"></i>
        <span>直接將照片或 50 MB 內短影片傳給官方帳號，就會自動收錄到這裡。</span>
      </div>

      <!-- 關鍵字搜尋、年份月份跳轉與成員頭像篩選列 -->
      <section class="album-search-panel" aria-label="搜尋與篩選相簿">
        <div class="search-bar-row">
          <div class="search-input-wrap">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input
              id="album-search-input"
              type="search"
              placeholder="搜尋日記文字、#標籤或關聯行程..."
              autocomplete="off"
            />
            <button id="btn-clear-search" class="search-clear-btn hidden" type="button" aria-label="清除搜尋文字">
              <i class="fa-solid fa-circle-xmark"></i>
            </button>
          </div>
          <button id="btn-album-search" class="btn btn-primary search-submit-btn" type="button">
            <i class="fa-solid fa-magnifying-glass"></i> 搜尋
          </button>
        </div>

        <div class="album-ym-row">
          <div class="ym-select-wrap">
            <i class="fa-regular fa-calendar ym-icon"></i>
            <select id="album-year-select" aria-label="依年份篩選相簿">
              <option value="">全部年份</option>
            </select>
          </div>
          <div class="ym-select-wrap">
            <select id="album-month-select" aria-label="依月份篩選相簿" disabled>
              <option value="">全部月份</option>
            </select>
          </div>
        </div>

        <div id="album-member-filter" class="member-filter-bar" aria-label="依上傳成員篩選"></div>
      </section>

      <!-- 篩選狀態列 -->
      <div id="album-filter-bar" class="filter-bar hidden">
        <span id="album-filter-label"></span>
        <button id="btn-clear-filter" class="btn btn-outline btn-xs" type="button">
          <i class="fa-solid fa-xmark"></i> 顯示全部
        </button>
      </div>

      <div id="album-list" class="album-list"></div>

      <div id="album-load-more-wrap" class="load-more-wrap hidden">
        <button id="btn-load-more" class="btn btn-outline" type="button">
          <i class="fa-solid fa-angles-down"></i> 載入更多回憶
        </button>
      </div>
    </main>

    <!-- 底部雙分頁導覽列 -->
    <nav class="bottom-nav">
      <button class="nav-item active" data-tab="calendar" type="button">
        <i class="fa-regular fa-calendar-days"></i>
        <span>行事曆</span>
      </button>
      <button class="nav-item" data-tab="album" type="button">
        <i class="fa-regular fa-images"></i>
        <span>生活相簿</span>
      </button>
    </nav>
  </div>

  <!-- 彈窗 1：新增 / 編輯 / 複製行程 -->
  <div id="modal-event" class="modal-backdrop hidden" role="dialog" aria-modal="true">
    <div class="modal-sheet">
      <div class="modal-header">
        <h3 id="modal-event-title">新增行程</h3>
        <div class="modal-header-actions">
          <button id="btn-copy-event" class="icon-btn hidden" type="button" title="複製成新行程" aria-label="複製成新行程">
            <i class="fa-regular fa-copy"></i>
          </button>
          <button id="btn-share-event" class="icon-btn share-btn hidden" type="button" title="分享此行程到 LINE" aria-label="分享此行程到 LINE">
            <i class="fa-regular fa-paper-plane"></i>
          </button>
          <button class="icon-btn modal-close" data-close="modal-event" type="button" aria-label="關閉">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
      </div>
      <form id="form-event" class="modal-body">
        <input type="hidden" id="ev-id" />

        <div class="form-group">
          <label for="ev-title">標題 <span class="muted">（標題與標籤至少填一項）</span></label>
          <input id="ev-title" type="text" maxlength="80" placeholder="若只選標籤可留空，月曆將直接顯示標籤名稱" />
        </div>

        <div class="form-group">
          <label>標籤 <span class="muted">（可多選，第一個標籤決定月曆底色）</span></label>
          <div id="ev-selected-tags" class="selected-tags-box"></div>
          <div id="ev-tag-chips" class="tag-chips"></div>
          <div class="tag-add-row">
            <input id="ev-tag-new-input" type="text" maxlength="40" placeholder="輸入新標籤（可用逗號一次輸入多個）" />
            <button id="btn-add-tag" class="btn btn-outline btn-sm" type="button">
              <i class="fa-solid fa-plus"></i> 加入
            </button>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="ev-start-date">開始日期 <span class="req">*</span></label>
            <input id="ev-start-date" type="date" required />
          </div>
          <div class="form-group">
            <label for="ev-end-date">結束日期</label>
            <input id="ev-end-date" type="date" />
          </div>
        </div>

        <div class="form-group">
          <label for="ev-start-time">時間（選填，留空為全天）</label>
          <input id="ev-start-time" type="time" />
        </div>

        <div class="form-group">
          <label for="ev-content">內容（支援換行）</label>
          <textarea id="ev-content" rows="5" placeholder="可記錄地點、預約時間、注意事項..."></textarea>
        </div>

        <div id="ev-meta-info" class="meta-info hidden"></div>

        <div class="modal-footer">
          <button id="btn-delete-event" class="btn btn-danger-outline hidden" type="button">
            <i class="fa-regular fa-trash-can"></i> 刪除
          </button>
          <div class="footer-right">
            <button class="btn btn-outline modal-close" data-close="modal-event" type="button">取消</button>
            <button id="btn-save-event" class="btn btn-primary" type="submit">
              <i class="fa-solid fa-check"></i> 儲存
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- 彈窗 2：編輯相簿貼文（日期、說明、關聯行程、合併、單檔刪除） -->
  <div id="modal-post" class="modal-backdrop hidden" role="dialog" aria-modal="true">
    <div class="modal-sheet">
      <div class="modal-header">
        <h3>編輯生活相簿</h3>
        <button class="icon-btn modal-close" data-close="modal-post" type="button" aria-label="關閉">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <form id="form-post" class="modal-body">
        <input type="hidden" id="post-id" />

        <div class="form-group">
          <label for="post-date">日記日期 <span class="req">*</span></label>
          <input id="post-date" type="date" required />
        </div>

        <div class="form-group">
          <label for="post-linked-event">關聯行事曆行程（前後 14 天）</label>
          <select id="post-linked-event">
            <option value="">不關聯行程</option>
          </select>
        </div>

        <div class="form-group">
          <label for="post-caption">文字說明（支援換行）</label>
          <textarea id="post-caption" rows="4" placeholder="寫下今天發生的趣事或拍攝地點..."></textarea>
        </div>

        <div class="form-group">
          <div class="label-with-action">
            <label>已收錄照片 / 影片（可單獨移至別篇或刪除）</label>
            <button id="btn-open-merge-post" class="btn btn-outline btn-xs" type="button">
              <i class="fa-solid fa-object-group"></i> 合併整篇至別篇
            </button>
          </div>
          <div id="post-edit-media-grid" class="edit-media-grid"></div>
        </div>

        <div class="modal-footer">
          <button id="btn-delete-post" class="btn btn-danger-outline" type="button">
            <i class="fa-regular fa-trash-can"></i> 刪除整篇
          </button>
          <div class="footer-right">
            <button class="btn btn-outline modal-close" data-close="modal-post" type="button">取消</button>
            <button id="btn-save-post" class="btn btn-primary" type="submit">
              <i class="fa-solid fa-check"></i> 儲存
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- 彈窗 3：合併照片／影片至另一篇相簿 -->
  <div id="modal-merge" class="modal-backdrop hidden" role="dialog" aria-modal="true">
    <div class="modal-sheet modal-sm">
      <div class="modal-header">
        <h3 id="modal-merge-title">合併至其他相簿</h3>
        <button class="icon-btn modal-close" data-close="modal-merge" type="button" aria-label="關閉">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <form id="form-merge" class="modal-body">
        <p id="merge-desc" class="merge-desc"></p>

        <div class="form-group">
          <label for="merge-target-select">選擇要併入的目標相簿 <span class="req">*</span></label>
          <select id="merge-target-select" required>
            <option value="">載入相簿清單中...</option>
          </select>
        </div>

        <div id="merge-caption-wrap" class="form-group">
          <label class="checkbox-inline">
            <input id="chk-merge-caption" type="checkbox" checked />
            <span>一併將這篇的文字說明附加到目標相簿</span>
          </label>
        </div>

        <div class="modal-footer">
          <div></div>
          <div class="footer-right">
            <button class="btn btn-outline modal-close" data-close="modal-merge" type="button">取消</button>
            <button id="btn-confirm-merge" class="btn btn-primary" type="submit">
              <i class="fa-solid fa-check"></i> 確定合併
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- 彈窗 4：修改自己的暱稱 -->
  <div id="modal-profile" class="modal-backdrop hidden" role="dialog" aria-modal="true">
    <div class="modal-sheet modal-sm">
      <div class="modal-header">
        <h3>修改顯示暱稱</h3>
        <button class="icon-btn modal-close" data-close="modal-profile" type="button" aria-label="關閉">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <form id="form-profile" class="modal-body">
        <div class="form-group">
          <label for="profile-name-input">暱稱</label>
          <input id="profile-name-input" type="text" maxlength="20" required />
        </div>
        <div class="modal-footer">
          <div></div>
          <div class="footer-right">
            <button class="btn btn-outline modal-close" data-close="modal-profile" type="button">取消</button>
            <button id="btn-save-profile" class="btn btn-primary" type="submit">儲存</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- 彈窗 6：自訂確認對話框 -->
  <div id="modal-confirm" class="modal-backdrop hidden" role="dialog" aria-modal="true">
    <div class="modal-sheet modal-sm">
      <div class="modal-header">
        <h3 id="confirm-title">確認操作</h3>
      </div>
      <div class="modal-body">
        <p id="confirm-message" class="confirm-text"></p>
        <div class="modal-footer">
          <div></div>
          <div class="footer-right">
            <button id="btn-confirm-cancel" class="btn btn-outline" type="button">取消</button>
            <button id="btn-confirm-ok" class="btn btn-danger" type="button">確定刪除</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
